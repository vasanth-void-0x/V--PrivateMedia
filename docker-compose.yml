services:
  backend:
    build: ./backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
    ports:
      - "8000:8000"
    volumes:
      - vpm-data:/app
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  vpm-data:
